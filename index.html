<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verificación de certificados · Carlos De León</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f2f8;--panel:#fff;--ink:#1d1840;--muted:#6a6585;--ok:#16794a;--okbg:#e5f5ec;--bad:#a12626;--badbg:#fbe9e9;--line:#ddd8ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111f;--panel:#1d1930;--ink:#ece9f7;--muted:#a49fc0;--ok:#5fd39a;--okbg:#12301f;--bad:#ff8f8f;--badbg:#3a1717;--line:#332e4d}}
:root[data-theme="dark"]{--bg:#14111f;--panel:#1d1930;--ink:#ece9f7;--muted:#a49fc0;--ok:#5fd39a;--okbg:#12301f;--bad:#ff8f8f;--badbg:#3a1717;--line:#332e4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#2b0b57;display:flex;justify-content:center;padding:10px 12px}
header img{max-width:100%;height:auto;width:360px;display:block}
main{max-width:640px;margin:0 auto;padding:22px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.badge{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.08em;padding:6px 12px;border-radius:999px;margin-bottom:14px}
.ok .badge{background:var(--okbg);color:var(--ok)}
.bad .badge{background:var(--badbg);color:var(--bad)}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 6px;overflow-wrap:anywhere}
.course{font-weight:600;color:#6d3bd2;margin:0 0 14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}
.dbg{color:var(--muted);font-size:.72rem;margin-top:16px;word-break:break-all}
</style>
</head>

var enc=function(s){return new TextEncoder().encode(s)};
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pb(pass,salt){
